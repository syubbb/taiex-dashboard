name: 盤中：每 5 分鐘收紅機率
on:
  schedule:
    - cron: "*/5 1-5 * * 1-5"   # 09:00–13:55 台北
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/intraday.py
        env:
          DATA_DIR: data-branch/data
          PYTHONPATH: scripts
      - run: scripts/commit.sh "盤中 $(TZ=Asia/Taipei date '+%F %H:%M')"
