name: 盤前：加入隔夜美股更新機率
on:
  schedule:
    # GitHub 在整點附近排程常延遲 4–6 小時，改用非整點並多跑幾次（重跑結果相同，不會重複寫）
    - cron: "17 21 * * *"    # 05:17 台北（美股收盤後）
    - cron: "47 21 * * *"    # 05:47 台北
    - cron: "23 22 * * *"    # 06:23 台北
    - cron: "53 22 * * *"    # 06:53 台北
    - cron: "29 23 * * *"    # 07:29 台北
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/premarket.py
        env:
          DATA_DIR: data-branch/data
          PYTHONPATH: scripts
      - run: scripts/commit.sh "盤前機率 $(TZ=Asia/Taipei date '+%F %H:%M')"
